# --- NOMBRE DE LA APP ---
spring.application.name=reportes-service

# --- BASE DE DATOS (PostgreSQL) ---
# Sintaxis: ${NOMBRE_VARIABLE:valor_por_defecto_local}
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:mi_base_datos}
spring.datasource.username=${DB_USER:usuario}
spring.datasource.password=${DB_PASSWORD:secreto}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / HIBERNATE ---
# En producción usar 'validate' o 'none', nunca 'update'
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Mostrar SQL en consola solo si estamos en modo DEBUG
spring.jpa.show-sql=false

# --- AWS CONFIG (Custom Properties) ---
# Estas las leemos en AwsConfig.java o ReporteServiceImpl.java
aws.s3.bucket=${AWS_BUCKET_NAME:mi-bucket-dev-reportes}
aws.region=${AWS_REGION:us-east-1}
# Nota: Las credenciales (Access Key) NO se ponen aquí.
# El SDK de Java las busca automáticamente en las variables de entorno del sistema.

# --- ACTUATOR (Monitoreo) ---
# Exponer endpoints para que AWS sepa si la app está viva
management.endpoints.web.exposure.include=health,info

# --- LOGGING ---
logging.level.com.tuempresa=INFO
logging.level.org.springframework.security=WARN